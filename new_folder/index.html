<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World Animation</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }

    .marquee {
      position: absolute;
      white-space: nowrap;
      font-size: 2rem;
      animation: slide 5s linear infinite;
    }

    @keyframes slide {
      0% {
        left: -100%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="marquee">Hello World</div>
</body>
</html>
